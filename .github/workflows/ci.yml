name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-and-test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux native dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - name: Test
        run: cargo test --workspace
      - name: Windows target compile check
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --workspace --tests --target x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --workspace --release

  windows-release:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install cargo-wix
        run: cargo install cargo-wix --version 0.3.9 --locked
      - name: Install WiX Toolset
        run: choco install wixtoolset --no-progress -y
      - name: Test
        run: cargo test --workspace
      - name: Build release binary
        run: cargo build --workspace --release --target x86_64-pc-windows-msvc
      - name: Build MSI installer
        working-directory: app
        run: cargo wix --package one-click-kb-switch --target x86_64-pc-windows-msvc --output ../target/wix/
      - name: Prepare release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/release-assets | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/one-click-kb-switch.exe target/release-assets/
          Copy-Item target/wix/*.msi target/release-assets/
          Copy-Item README.md target/release-assets/
          Copy-Item LICENSE target/release-assets/
          $version = (Get-Content app/Cargo.toml | Select-String '^version = "').ToString().Split('"')[1]
          $notes = Get-Content .github/release/windows-release-notes-template.md -Raw
          $notes = $notes.Replace('{{version}}', $version)
          Set-Content target/release-assets/RELEASE_NOTES.md $notes
          Get-ChildItem target/release-assets | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Add-Content target/release-assets/SHA256SUMS.txt
          }
      - name: Upload Windows release bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-bundle
          path: target/release-assets
      - name: Publish GitHub release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release-assets/*
