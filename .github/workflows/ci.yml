name: manual-validate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Validate desktop runtime
        run: uv run python -c "import tkinter, pystray; print(tkinter.TkVersion); print(pystray.Icon.__module__)"
      - name: Run tests
        run: uv run pytest
