[package]
name = "one-click-kb-switch"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native-first keyboard layout switcher"

[dependencies]
anyhow = "1"
directories = "6"
font8x8 = "0.3"
global-hotkey = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.34.6"
thiserror = "2"
tray-icon = { version = "0.21.3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
